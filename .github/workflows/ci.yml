name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  NGINX_REF: stable-1.30

permissions:
  contents: read

jobs:
  check:
    name: Format, lints and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install nginx build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcre2-dev zlib1g-dev

      # Formatting needs nothing built.
      - run: cargo fmt --check

      # Both of these compile the library, which links against nginx. The ngx
      # dependency has its "vendored" feature on, so cargo builds a copy of
      # nginx first; the apt packages above are what that build needs.
      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test

  functional:
    name: Conditional requests against a real nginx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nginx/nginx
          ref: ${{ env.NGINX_REF }}
          path: nginx

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-functional-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-functional-

      - name: Install nginx build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcre2-dev zlib1g-dev

      # --with-compat is required to load dynamic modules at all, and
      # --with-debug is what makes the module's own log lines visible, which is
      # how the script tells this module apart from nginx's built-in one.
      - name: Build nginx
        working-directory: nginx
        run: |
          auto/configure --with-compat --with-debug --without-http_rewrite_module
          make -j"$(nproc)"

      # Building against this nginx rather than a vendored one, so that the
      # module's signature matches and nginx will load it.
      - name: Build the module
        env:
          NGINX_BUILD_DIR: ${{ github.workspace }}/nginx/objs
        run: cargo build --no-default-features --features export-modules

      - name: Run the conditional request checks
        run: |
          ./tests/functional.sh \
            nginx/objs/nginx \
            target/debug/libngx_http_not_modified_filter_module.so

      - name: Upload nginx error log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nginx-error-log
          path: /tmp/tmp.*/logs/error.log
          if-no-files-found: ignore
